name: CI

on:
  push:
  pull_request:

# Un nuovo push sullo stesso ref annulla la run precedente
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # php -l e test su ogni versione di PHP supportata: il plugin dichiara 7.4+.
  # composer.lock è risolto per PHP 7.4 (config.platform), quindi si installa ovunque
  php:
    name: "PHP ${{ matrix.php }}: sintassi e PHPUnit"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["7.4", "8.0", "8.1", "8.2", "8.3", "8.4", "8.5"]
    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer

      - name: php -l
        run: |
          errors=0
          while IFS= read -r file; do
            php -l "$file" > /dev/null || errors=1
          done < <(find . -name '*.php' -not -path './.git/*' -not -path './vendor/*')
          exit $errors

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run PHPUnit
        run: ./vendor/bin/phpunit --configuration phpunit.xml --testdox

  phpcs:
    name: "PHPCS (WordPress.Security + PHPCompatibility 7.4+)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
          tools: composer

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run PHPCS
        run: ./vendor/bin/phpcs --report=full

  javascript:
    name: "Sintassi JavaScript"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: node --check (file e script inline)
        run: node bin/check-js.js
