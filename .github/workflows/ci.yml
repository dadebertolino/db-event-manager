name: CI

on:
  push:
  pull_request:

# Un nuovo push sullo stesso ref annulla la run precedente
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # php -l e unit test su ogni versione di PHP supportata: il plugin dichiara 7.4+.
  # composer.lock è risolto per PHP 7.4 (config.platform), quindi si installa ovunque
  php:
    name: "PHP ${{ matrix.php }}: sintassi e PHPUnit"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["7.4", "8.0", "8.1", "8.2", "8.3", "8.4", "8.5"]
    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer

      - name: php -l
        run: |
          errors=0
          while IFS= read -r file; do
            php -l "$file" > /dev/null || errors=1
          done < <(find . -name '*.php' -not -path './.git/*' -not -path './vendor/*')
          exit $errors

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run PHPUnit
        run: ./vendor/bin/phpunit --configuration phpunit.xml --testsuite unit --testdox

  phpcs:
    name: "PHPCS (WordPress.Security + PHPCompatibility 7.4+)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
          tools: composer

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run PHPCS
        run: ./vendor/bin/phpcs --report=full

  javascript:
    name: "Sintassi JavaScript"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: node --check (file e script inline)
        run: node bin/check-js.js

  # Integration: PHPUnit + WordPress test suite + MySQL reale. 6.0 = minimo
  # dichiarato nell'intestazione del plugin, latest = versione corrente
  integration:
    name: "Integration (WP ${{ matrix.wp }}${{ matrix.multisite == '1' && ', multisite' || '' }})"
    runs-on: ubuntu-latest
    needs: [php]
    strategy:
      fail-fast: false
      matrix:
        include:
          - wp: "6.0"
            php: "8.0"
            multisite: "0"
          - wp: latest
            php: "8.3"
            multisite: "0"
          - wp: latest
            php: "8.3"
            multisite: "1"
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer
          extensions: mysqli
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Installa WordPress test suite
        # Subversion serve per scaricare la test suite da develop.svn.wordpress.org
        run: |
          sudo apt-get update && sudo apt-get install -y subversion
          bash bin/install-wp-tests.sh wordpress_test root root 127.0.0.1 ${{ matrix.wp }}

      - name: PHPUnit (integration)
        env:
          WP_TESTS_DIR: /tmp/wordpress-tests-lib
          WP_MULTISITE: ${{ matrix.multisite }}
        run: ./vendor/bin/phpunit -c phpunit-integration.xml.dist --colors=always

  # E2E: wp-env + Playwright (workflow riutilizzabile, vedi e2e.yml). Parte solo se
  # sintassi, test e PHPCS passano: inutile avviare Docker con il codice rotto
  e2e:
    name: E2E (wp-env + Playwright)
    needs: [php, phpcs, javascript]
    uses: ./.github/workflows/e2e.yml
